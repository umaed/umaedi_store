<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Chat Pelanggan</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/chat.css">
</head>
<body>
    <header class="navbar">
        <a href="admin.html" class="nav-brand">
            <img src="../assets/img/logo.png" alt="UmaDigi Logo" class="nav-logo">
            <span>Chat Pelanggan</span>
        </a>
        <div class="nav-actions">
            <button class="icon-btn" onclick="window.location.href='admin.html'"><span class="material-symbols-outlined">arrow_back</span></button>
        </div>
    </header>

    <main class="admin-chat-wrapper">
        <!-- Daftar Percakapan -->
        <div class="admin-chat-list">
            <div class="admin-chat-list-header">Percakapan</div>
            <div id="conv-items"></div>
        </div>
        <!-- Isi Chat -->
        <div class="admin-chat-main">
            <div id="chat-header" class="admin-chat-header">
                <div class="admin-chat-header-avatar" id="chat-avatar">P</div>
                <div class="admin-chat-header-info">
                    <div class="admin-chat-header-name" id="chat-name">Pelanggan</div>
                    <div class="admin-chat-header-status">Online</div>
                </div>
            </div>
            <div id="chat-box" class="admin-chat-box"></div>
            <div class="admin-chat-input">
                <input type="text" id="chat-input" class="chat-input" placeholder="Tulis pesan...">
                <button id="send-btn" class="chat-send-btn">
                    <span class="material-symbols-outlined">send</span>
                </button>
            </div>
        </div>
    </main>

    <script type="module" src="../js/admin-chat.js"></script>
</body>
</html>
