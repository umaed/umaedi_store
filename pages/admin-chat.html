<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Chat Pelanggan</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body>
    <header class="navbar">
        <a href="admin.html" class="nav-brand">
            <img src="../assets/img/logo.png" alt="UmaDigi Logo" class="nav-logo">
            <span>Chat Pelanggan</span>
        </a>
        <div class="nav-actions">
            <button class="icon-btn" onclick="window.location.href='admin.html'"><span class="material-symbols-outlined">arrow_back</span></button>
        </div>
    </header>

    <main style="padding: 20px; max-width: 1000px; margin: 0 auto; padding-bottom: 80px;">
        <div style="display: flex; gap: 20px; height: 70vh;">
            <!-- Daftar Percakapan -->
            <div id="conversation-list" style="width: 300px; background: white; border-radius: 12px; border: 1px solid var(--border); overflow-y: auto; padding: 10px;">
                <h3 style="margin-bottom: 10px;">Percakapan</h3>
                <div id="conv-items"></div>
            </div>
            <!-- Isi Chat -->
            <div style="flex: 1; background: white; border-radius: 12px; border: 1px solid var(--border); display: flex; flex-direction: column;">
                <div id="chat-header" style="padding: 15px; border-bottom: 1px solid var(--border); font-weight: 600;"></div>
                <div id="chat-box" style="flex: 1; overflow-y: auto; padding: 15px;"></div>
                <div style="padding: 15px; border-top: 1px solid var(--border); display: flex; gap: 10px;">
                    <input type="text" id="chat-input" placeholder="Tulis pesan..." style="flex: 1; padding: 12px; border: 1px solid var(--border); border-radius: 8px;">
                    <button id="send-btn" class="btn-primary" style="padding: 12px 20px; border-radius: 8px;">Kirim</button>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="../js/admin-chat.js"></script>
</body>
</html>
