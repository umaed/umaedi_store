<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - UmaDigi Store V2</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    <header class="navbar">
        <a href="home.html" class="nav-brand">UmaDigi Store [ADMIN]</a>
        <div class="nav-actions">
            <button class="icon-btn" onclick="window.location.href='home.html'" title="Keluar ke Toko">🏠</button>
        </div>
    </header>

    <main class="admin-container">
        <!-- Status Proteksi / Loading -->
        <div id="admin-guard-loading" style="text-align: center; padding: 60px; color: var(--muted);">
            Memverifikasi hak akses admin...
        </div>

        <!-- Dashboard Utama (Disembunyikan sebelum lolos verifikasi role) -->
        <div id="admin-dashboard-content" style="display: none;">
            <div class="admin-header">
                <h1 class="admin-title">Dashboard Pengelola</h1>
                <button class="btn-primary" id="btn-open-add-product" style="width: auto; padding: 10px 20px;">+ Tambah Produk Baru</button>
            </div>

            <!-- Statistik Singkat -->
            <div class="admin-stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Total Produk</div>
                    <div class="stat-value" id="stat-total-products">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Pesanan Masuk</div>
                    <div class="stat-value" id="stat-total-orders">0</div>
                </div>
            </div>

            <!-- Manajemen Produk -->
            <div class="admin-section">
                <div class="section-header-flex">
                    <h3 style="font-size: 1.1rem;">Daftar Produk</h3>
                </div>
                <div class="table-responsive">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Nama Produk</th>
                                <th>Kategori</th>
                                <th>Harga</th>
                                <th>Status</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="admin-products-table">
                            <!-- Diisi via JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Manajemen Pesanan -->
            <div class="admin-section">
                <div class="section-header-flex">
                    <h3 style="font-size: 1.1rem;">Kelola Pesanan Masuk</h3>
                </div>
                <div class="table-responsive">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>ID Order</th>
                                <th>Pembeli</th>
                                <th>Total</th>
                                <th>Status Pesanan</th>
                                <th>Ubah Status</th>
                            </tr>
                        </thead>
                        <tbody id="admin-orders-table">
                            <!-- Diisi via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Tambah Produk -->
    <div class="admin-modal" id="modal-product">
        <div class="admin-modal-content">
            <h3 style="margin-bottom: 20px;">Tambah Produk Baru</h3>
            <form id="form-add-product">
                <div class="form-group">
                    <label>Nama Produk</label>
                    <input type="text" id="add-name" required placeholder="Contoh: Preset Lightroom Cinematic">
                </div>
                <div class="form-group">
                    <label>Kategori</label>
                    <input type="text" id="add-category" required placeholder="Contoh: Preset">
                </div>
                <div class="form-group">
                    <label>Harga (Rupiah)</label>
                    <input type="number" id="add-price" required placeholder="50000">
                </div>
                <div class="form-group">
                    <label>URL Gambar</label>
                    <input type="url" id="add-image" required placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>Deskripsi</label>
                    <textarea id="add-desc" rows="3" placeholder="Deskripsi produk..."></textarea>
                </div>
                
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="button" class="btn-primary" style="background-color: var(--muted);" id="btn-close-modal">Batal</button>
                    <button type="submit" class="btn-primary" id="btn-save-product">Simpan Produk</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="../js/admin.js"></script>
</body>
</html>
