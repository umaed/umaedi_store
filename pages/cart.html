<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keranjang - UmaDigi Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/cart.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-actions">
            <button class="icon-btn" onclick="window.history.back()">🔙</button>
        </div>
        <div class="nav-brand" style="font-size: 1.1rem;">Keranjang Belanja</div>
        <div class="nav-actions"></div>
    </header>

    <main class="cart-container">
        <div id="cart-items">
            <p style="text-align: center; color: var(--muted); padding: 40px;">Memuat keranjang...</p>
        </div>
    </main>

    <!-- Ringkasan Bawah Tetap (Sticky) -->
    <div id="cart-summary-box" class="cart-summary">
        <div class="cart-summary-inner">
            <div>
                <div class="summary-label">Total Belanja</div>
                <div id="summary-total" class="summary-total">Rp 0</div>
            </div>
            <button id="btn-checkout" class="btn-checkout-summary">Checkout</button>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item">
            <span class="material-symbols-outlined">home</span><span>Home</span>
        </a>
        <a href="explore.html" class="nav-item">
            <span class="material-symbols-outlined">explore</span><span>Explore</span>
        </a>
        <a href="orders.html" class="nav-item">
            <span class="material-symbols-outlined">local_shipping</span><span>Orders</span>
        </a>
        <a href="cart.html" class="nav-item active">
            <div style="position: relative;">
                <span class="material-symbols-outlined">shopping_cart</span>
                <span class="cart-badge-count">0</span>
            </div>
            <span>Keranjang</span>
        </a>
        <a href="profile.html" class="nav-item">
            <span class="material-symbols-outlined">person</span><span>Profile</span>
        </a>
    </nav>

    <script type="module" src="../js/app.js"></script>
    <script type="module" src="../js/cart.js"></script>
</body>
</html>
