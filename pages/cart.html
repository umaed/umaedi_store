<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keranjang - UmaDigi Store V2</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/cart.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-actions">
            <button class="icon-btn" onclick="window.history.back()">🔙</button>
        </div>
        <div class="nav-brand" style="font-size: 1.1rem;">Keranjang Belanja</div>
        <div class="nav-actions">
            <!-- Kosong agar rapi -->
        </div>
    </header>

    <main class="cart-container">
        <!-- Area List Produk -->
        <div id="cart-items">
            <p style="text-align: center; color: var(--muted); padding: 40px;">Memuat keranjang...</p>
        </div>

        <!-- Area Total -->
        <div class="cart-summary" id="cart-summary-box" style="display: none;">
            <div class="summary-row">
                <span>Subtotal</span>
                <span id="summary-subtotal">Rp 0</span>
            </div>
            <div class="summary-row">
                <span>Diskon</span>
                <span style="color: var(--success);">- Rp 0</span>
            </div>
            <div class="summary-total">
                <span>Total</span>
                <span id="summary-total">Rp 0</span>
            </div>
            <button class="btn-cart" style="width: 100%; margin-top: 20px; padding: 15px;" id="btn-checkout">Lanjut Checkout</button>
        </div>
    </main>

    <script type="module" src="../js/app.js"></script>
    <script type="module" src="../js/cart.js"></script>
</body>
</html>
