<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Admin - UmaDigi Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-actions">
            <button class="icon-btn" onclick="window.history.back()">🔙</button>
        </div>
        <div class="nav-brand" style="font-size: 1.1rem;">Chat Admin</div>
        <div class="nav-actions"></div>
    </header>

    <main style="padding: 20px; max-width: 800px; margin: 0 auto; padding-bottom: 80px;">
        <div id="chat-box" style="background: white; border-radius: 12px; padding: 15px; height: 60vh; overflow-y: auto; border: 1px solid var(--border);">
            <!-- Pesan akan muncul di sini -->
        </div>
        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <input type="text" id="chat-input" placeholder="Tulis pesan..." style="flex: 1; padding: 12px; border: 1px solid var(--border); border-radius: 8px;">
            <button id="send-btn" class="btn-primary" style="padding: 12px 20px; border-radius: 8px;">Kirim</button>
        </div>
    </main>

    <script type="module" src="../js/chat.js"></script>
</body>
</html>
