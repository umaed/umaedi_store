<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Admin - UmaDigi Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/chat.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-actions">
            <button class="icon-btn" onclick="window.history.back()">🔙</button>
        </div>
        <div class="nav-brand" style="font-size: 1.1rem;">Chat Admin</div>
        <div class="nav-actions"></div>
    </header>

    <main class="chat-container">
        <!-- Header chat -->
        <div class="chat-header">
            <div class="chat-header-avatar">U</div>
            <div class="chat-header-info">
                <div class="chat-header-name">UmaDigi Store</div>
                <div class="chat-header-status">Online</div>
            </div>
        </div>
        <div id="chat-box" class="chat-box">
            <!-- Pesan akan muncul di sini -->
        </div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" class="chat-input" placeholder="Tulis pesan...">
            <button id="send-btn" class="chat-send-btn">
                <span class="material-symbols-outlined">send</span>
            </button>
        </div>
    </main>

    <script type="module" src="../js/chat.js"></script>
</body>
</html>
