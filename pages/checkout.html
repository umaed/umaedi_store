<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - UmaDigi Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/checkout.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-actions">
            <button class="icon-btn" onclick="window.history.back()">🔙</button>
        </div>
        <div class="nav-brand" style="font-size: 1.1rem;">Checkout Pesanan</div>
        <div class="nav-actions"></div>
    </header>

    <main class="checkout-container">
        <div id="checkout-loading" style="text-align: center; padding: 50px; color: var(--muted);">Menyiapkan data checkout...</div>
        
        <form id="checkout-form" class="checkout-grid" style="display: none;">
            <!-- Kolom Kiri: Form Informasi -->
            <div class="checkout-section">
                <h2 class="checkout-title">Informasi Pembeli</h2>
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" id="co-name" readonly required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="co-email" readonly required>
                </div>
                <div class="form-group">
                    <label>Nomor WhatsApp</label>
                    <input type="tel" id="co-phone" placeholder="Contoh: 08123456789" required>
                </div>

                <h2 class="checkout-title" style="margin-top: 25px;">Metode Pembayaran</h2>
                <div class="form-group">
                    <select id="co-payment" required>
                        <option value="">Pilih Metode Pembayaran</option>
                        <option value="QRIS" selected>QRIS (Rekomendasi)</option>
                        <option value="DANA">DANA</option>
                        <option value="GoPay">GoPay</option>
                        <option value="SeaBank">SeaBank</option>
                    </select>
                </div>
                
                <div id="payment-instruction" class="payment-instruction-box"></div>

                <div class="form-group" style="margin-top: 15px;">
                    <label>Upload Bukti Pembayaran <span style="color:var(--danger)">*</span></label>
                    <input type="file" id="co-proof" accept="image/*" required>
                </div>

                <div class="form-group" style="margin-top: 15px;">
                    <label>Catatan Pesanan (Opsional)</label>
                    <textarea id="co-notes" rows="2" placeholder="Catatan untuk penjual..."></textarea>
                </div>
            </div>

            <!-- Kolom Kanan: Ringkasan Pesanan -->
            <div class="checkout-section">
                <h2 class="checkout-title">Ringkasan Pesanan</h2>
                <div id="co-items-list"></div>
                
                <div class="summary-total-row" style="margin-top: 20px;">
                    <span>Subtotal</span>
                    <span id="co-subtotal">Rp 0</span>
                </div>
                <div class="summary-total-row">
                    <span>Biaya Admin</span>
                    <span style="color: var(--success); font-weight: 600;">Gratis</span>
                </div>
                <div class="summary-grand-total">
                    <span>Total Bayar</span>
                    <span id="co-total">Rp 0</span>
                </div>

                <button type="submit" id="btn-process-order" class="btn-primary" style="width: 100%; margin-top: 20px; padding: 15px; font-size: 1.05rem;">
                    Menunggu Bukti Transfer
                </button>
            </div>
        </form>
    </main>

    <script type="module" src="../js/app.js"></script>
    <script type="module" src="../js/checkout.js"></script>
</body>
</html>
