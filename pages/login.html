<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - UmaDigi Store V2</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/forms.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2>Selamat Datang Kembali</h2>
            <p>Login untuk mengakses UmaDigi Store</p>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" required placeholder="Masukkan email Anda">
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" required placeholder="Masukkan password">
                </div>
                
                <div id="login-error" class="error-message"></div>
                
                <button type="submit" class="btn-primary" id="login-btn">Masuk</button>
            </form>
            
            <p class="auth-link">Belum punya akun? <a href="register.html">Daftar di sini</a></p>
            <p class="auth-link"><a href="#" id="forgot-password">Lupa Password?</a></p>
        </div>
    </div>

    <script type="module" src="../js/auth.js"></script>
</body>
</html>
