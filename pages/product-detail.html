<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Produk - UmaDigi Store V2</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/product-detail.css">
</head>
<body>
    <!-- Top Navbar khusus Detail -->
    <header class="navbar">
        <div class="nav-actions">
            <!-- Tombol Kembali -->
            <button class="icon-btn" onclick="window.history.back()" aria-label="Back">🔙</button>
        </div>
        <div class="nav-brand" style="font-size: 1rem;">Detail Produk</div>
        <div class="nav-actions">
            <button class="icon-btn" aria-label="Cart">🛒</button>
        </div>
    </header>

    <!-- Kontainer Detail Produk (Akan diisi oleh JS) -->
    <main class="detail-container" id="product-detail-container">
        <div style="padding: 40px; text-align: center; color: var(--muted); width: 100%;">
            <p>Memuat informasi produk...</p>
        </div>
    </main>

    <!-- Script Global -->
    <script type="module" src="../js/app.js"></script>
    <!-- Script Produk -->
    <script type="module" src="../js/products.js"></script>
</body>
</html>
