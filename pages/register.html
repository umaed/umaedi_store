<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - UmaDigi Store V2</title>
    <!-- Menghubungkan CSS Global dan Form -->
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/forms.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2>Daftar Akun Baru</h2>
            <p>Mulai belanja produk digital di UmaDigi Store</p>
            
            <form id="register-form">
                <div class="form-group">
                    <label for="reg-name">Nama Lengkap</label>
                    <input type="text" id="reg-name" required placeholder="Masukkan nama lengkap">
                </div>
                <div class="form-group">
                    <label for="reg-username">Username</label>
                    <input type="text" id="reg-username" required placeholder="Pilih username">
                </div>
                <div class="form-group">
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" required placeholder="Masukkan email">
                </div>
                <div class="form-group">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" required placeholder="Minimal 6 karakter">
                </div>
                <div class="form-group">
                    <label for="reg-confirm">Konfirmasi Password</label>
                    <input type="password" id="reg-confirm" required placeholder="Ulangi password">
                </div>
                
                <div id="reg-error" class="error-message"></div>
                
                <button type="submit" class="btn-primary" id="reg-btn">Daftar Sekarang</button>
            </form>
            
            <p class="auth-link">Sudah punya akun? <a href="login.html">Login di sini</a></p>
        </div>
    </div>

    <!-- Script menggunakan type="module" karena menggunakan Firebase SDK Modular -->
    <script type="module" src="../js/auth.js"></script>
</body>
</html>
